services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: british_legislation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433: 5432 is taken by other local projects (plp-local-db).
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # The container's psql is how we reach PlanetScale (the host's is broken),
      # and that DSN uses sslmode=verify-full. The base image ships no CA bundle,
      # and an apt-get install of one is lost whenever the container is
      # recreated, so mount a copy of the host's. Refresh it with:
      #   cp /opt/homebrew/etc/ca-certificates/cert.pem var/tls/ca-certificates.crt
      - ./var/tls/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d british_legislation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
