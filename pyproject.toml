[project]
name = "git-legislation"
version = "0.1.0"
description = "Represent legislation.gov.uk data as structured Postgres and object-store records."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.40",
    "fastapi>=0.138.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "liteparse>=2.0.6",
    "markdown>=3.10.2",
    "marker-pdf",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.49.0",
    "xmlformatter>=0.2.8",
]

[project.scripts]
git-legislation = "git_legislation.cli:app"
git-legislation-api = "git_legislation_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/converters",
    "src/coverage_audit",
    "src/fetchers",
    "src/git_legislation",
    "src/git_legislation_api",
    "src/object_store",
    "src/pdf_parsing",
    "src/publishing",
    "src/seeding",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "ty>=0.0.55",
]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src", "web-app"]
pythonpath = ["src"]

[tool.uv.sources]
marker-pdf = { git = "https://github.com/datalab-to/marker.git" }
