[project]
name = "git-legislation"
version = "0.1.0"
description = "Represent legislation.gov.uk data as deterministic Markdown in Git."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "xmlformatter>=0.2.8",
]

[project.scripts]
git-legislation = "git_legislation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/converters",
    "src/coverage_audit",
    "src/fetchers",
    "src/git_legislation",
    "src/object_store",
    "src/publishing",
    "src/seeding",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
